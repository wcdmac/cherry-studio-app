name: iOS Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.1.2 (used to tag unsigned-ios-vX.Y.Z)"
        required: true
        default: "0.1.2"
  push:
    tags:
      - "unsigned-ios-v*"

permissions:
  contents: write

env:
  PROFILE: production
  NODE_VERSION: "24.19.0"
  PNPM_VERSION: "12.2.1"
  EXPO_NO_TELEMETRY: "1"
  CI: "1"
  EAS_BUILD_IOS_BUILD_NUMBER: "1"

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-unsigned-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure CocoaPods
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods
          fi
          pod --version

      - name: Prebuild iOS (generate native project)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install pods
        run: cd ios && pod install --repo-update

      - name: Archive with code signing disabled
        run: |
          cd "$GITHUB_WORKSPACE"
          WORKSPACE=$(ls -d ios/*.xcworkspace 2>/dev/null | head -n1)
          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: no .xcworkspace found under ios/"; ls -la ios; exit 1
          fi
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package unsigned IPA
        run: |
          cd "$GITHUB_WORKSPACE"
          APP=$(find build/App.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -n1)
          echo "App: $APP"
          test -n "$APP"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -r "$APP" build/Payload/
          cd build
          zip -r "../CherryStudio-unsigned.ipa" Payload
          cd ..
          ls -lh CherryStudio-unsigned.ipa

      - name: Compute release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=unsigned-ios-v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: iOS Unsigned IPA ${{ steps.tag.outputs.tag }}
          files: CherryStudio-unsigned.ipa
          prerelease: true
          body: |
            Unsigned iOS IPA built with CODE_SIGNING_ALLOWED=NO.
            Build: Expo prebuild + xcodebuild archive (no signing).
            WARNING: 非越狱真机无法直接安装/启动，仅供构建产物与后续重签名使用。
